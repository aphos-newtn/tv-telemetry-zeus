name: Update TV telemetry feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: tv-telemetry-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate converter
        run: python3 -m unittest discover -s tests -v
      - name: Fetch and convert current upstream list
        run: python3 scripts/build.py
      - name: Commit updated feed and report only if changed
        run: |
          git add -- tv-telemetry-adlist.txt build-report.json
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh RouterOS TV telemetry feed'
          git push
