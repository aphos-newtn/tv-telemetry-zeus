name: Update Zeus TV telemetry feed

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

permissions:
  contents: write

concurrency:
  group: tv-telemetry-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate converter
        run: python3 -m unittest discover -s tests -v
      - name: Fetch and convert latest upstream list
        run: python3 scripts/build.py
      - name: Commit updated output if changed
        run: |
          git add tv-telemetry-adlist.txt build-report.json
          if git diff --cached --quiet; then
            echo 'Feed already current; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh TV telemetry feed'
          git push
